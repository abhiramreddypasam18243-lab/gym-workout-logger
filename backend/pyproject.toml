[project]
name = "gym-workout-logger"
version = "0.1.0"
description = "Gym Workout Logger and Strength-Focused Diet Planner"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.12",
    "uvicorn[standard]>=0.34.2",
    "sqlalchemy[asyncio]>=2.0.40",
    "asyncpg>=0.30.0",
    "alembic>=1.15.2",
    "pydantic>=2.11.3",
    "pydantic-settings>=2.9.1",
    "argon2-cffi>=23.1.0",
    "python-multipart>=0.0.31",
    "httpx>=0.28.1",
    "aiosqlite>=0.21.0",
    "jsonschema>=4.21.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
exclude = ["tests*", "static*"]

[project.optional-dependencies]
dev = [
    "pytest==8.3.5",
    "pytest-asyncio==0.26.0",
    "pytest-cov==6.1.1",
    "httpx==0.28.1",
    "ruff==0.11.12",
    "mypy==1.15.0",
    "pip-audit==2.9.0",
    "aiosqlite>=0.21.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "SIM"]
ignore = ["E501", "B008"]


[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

