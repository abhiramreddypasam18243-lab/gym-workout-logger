[project]
name = "gym-workout-logger"
version = "0.1.0"
description = "Gym Workout Logger and Strength-Focused Diet Planner"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.143.3",
    "uvicorn[standard]==0.54.0",
    "sqlalchemy[asyncio]==2.1.5",
    "asyncpg==0.32.0",
    "alembic==1.20.0",
    "pydantic==2.14.1",
    "pydantic-settings==2.16.0",
    "argon2-cffi==25.1.0",
    "python-multipart==0.0.32",
    "httpx==0.28.1",
    "aiosqlite==0.22.1",
    "jsonschema==4.26.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
exclude = ["tests*", "static*"]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
    "httpx==0.28.1",
    "hypothesis==6.170.1",
    "ruff==0.17.1",
    "mypy==2.4.0",
    "pip-audit==2.10.1",
    "aiosqlite==0.22.1",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "SIM"]
ignore = ["E501", "B008"]


[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]


[[tool.mypy.overrides]]
# jsonschema ships no type hints; adding types-jsonschema would be a new dependency
module = ["jsonschema", "jsonschema.*"]
ignore_missing_imports = true
