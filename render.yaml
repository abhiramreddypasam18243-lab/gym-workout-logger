services:
  - type: web
    name: titan-strength-app
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: oregon
    envVars:
      - key: PORT
        value: 10000
      - key: ENVIRONMENT
        value: development
      - key: SESSION_SECRET
        generateValue: true
      - key: ALLOWED_ORIGIN
        value: "*"
      - key: DATABASE_URL
        fromDatabase:
          name: titan-strength-db
          property: connectionString

databases:
  - name: titan-strength-db
    plan: free
    region: oregon
    databaseName: gym_app
    user: gym_user
