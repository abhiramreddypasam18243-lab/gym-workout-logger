services:
  - type: web
    name: gym-workout-logger
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: oregon
    envVars:
      - key: PORT
        value: 10000
      - key: ENVIRONMENT
        value: production
      - key: SESSION_SECRET
        generateValue: true
      # Frontend is served by the same container, so the only browser origin is the service URL.
      # Change this if you rename the service or add a custom domain.
      - key: ALLOWED_ORIGIN
        value: https://gym-workout-logger-v0ri.onrender.com
      # Render's load balancer is the only ingress; it terminates TLS and sets X-Forwarded-*.
      - key: TRUSTED_PROXY_IP
        value: "*"
      # Synthetic demo account for the viva demo; set to "false" to skip creating it.
      - key: DEMO_MODE
        value: "true"
      # Neon free Postgres (us-west-2). The connection string contains the password,
      # so it is entered in the Render dashboard and never committed.
      - key: DATABASE_URL
        sync: false
