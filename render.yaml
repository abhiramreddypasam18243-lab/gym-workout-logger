services:
  - type: web
    name: titan-strength-app
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: oregon
    envVars:
      - key: PORT
        value: 10000
      - key: ENVIRONMENT
        value: production
      - key: SESSION_SECRET
        generateValue: true
      # Frontend is served by the same container, so the only browser origin is the service URL.
      # Change this if you rename the service or add a custom domain.
      - key: ALLOWED_ORIGIN
        value: https://titan-strength-app.onrender.com
      # Render's load balancer is the only ingress; it terminates TLS and sets X-Forwarded-*.
      - key: TRUSTED_PROXY_IP
        value: "*"
      # Synthetic demo account for the viva demo; set to "false" to skip creating it.
      - key: DEMO_MODE
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: titan-strength-db
          property: connectionString

databases:
  - name: titan-strength-db
    plan: free
    region: oregon
    databaseName: gym_app
    user: gym_user
